<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <title>Data Infographic</title>
  <desc>A complex infographic with gradients, text, and multiple visual elements</desc>

  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>

    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>

    <radialGradient id="circleGradient" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="100" fill="url(#circleGradient)"/>
  <circle cx="550" cy="350" r="150" fill="url(#circleGradient)"/>

  <!-- Title -->
  <text x="300" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff" filter="url(#glow)">
    2025 Performance Metrics
  </text>

  <!-- Stat Cards -->
  <!-- Card 1 -->
  <g transform="translate(30, 80)" filter="url(#shadow)">
    <rect width="160" height="120" rx="10" fill="url(#cardGradient)"/>
    <text x="80" y="40" text-anchor="middle" font-size="14" fill="#666">Users</text>
    <text x="80" y="80" text-anchor="middle" font-size="32" font-weight="bold" fill="#667eea">1.2M</text>
    <text x="80" y="105" text-anchor="middle" font-size="12" fill="#4caf50">↑ 24%</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(220, 80)" filter="url(#shadow)">
    <rect width="160" height="120" rx="10" fill="url(#cardGradient)"/>
    <text x="80" y="40" text-anchor="middle" font-size="14" fill="#666">Revenue</text>
    <text x="80" y="80" text-anchor="middle" font-size="32" font-weight="bold" fill="#667eea">$4.5M</text>
    <text x="80" y="105" text-anchor="middle" font-size="12" fill="#4caf50">↑ 18%</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(410, 80)" filter="url(#shadow)">
    <rect width="160" height="120" rx="10" fill="url(#cardGradient)"/>
    <text x="80" y="40" text-anchor="middle" font-size="14" fill="#666">Conversion</text>
    <text x="80" y="80" text-anchor="middle" font-size="32" font-weight="bold" fill="#667eea">3.2%</text>
    <text x="80" y="105" text-anchor="middle" font-size="12" fill="#f44336">↓ 2%</text>
  </g>

  <!-- Progress bars section -->
  <g transform="translate(30, 230)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#ffffff">Goals Progress</text>

    <!-- Progress bar 1 -->
    <text x="0" y="30" font-size="12" fill="#ffffff">Q1 Target</text>
    <rect x="0" y="40" width="540" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
    <rect x="0" y="40" width="450" height="20" rx="10" fill="#4caf50"/>
    <text x="550" y="55" font-size="12" fill="#ffffff">83%</text>

    <!-- Progress bar 2 -->
    <text x="0" y="80" font-size="12" fill="#ffffff">Q2 Target</text>
    <rect x="0" y="90" width="540" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
    <rect x="0" y="90" width="380" height="20" rx="10" fill="#ff9800"/>
    <text x="550" y="105" font-size="12" fill="#ffffff">70%</text>

    <!-- Progress bar 3 -->
    <text x="0" y="130" font-size="12" fill="#ffffff">Annual Goal</text>
    <rect x="0" y="140" width="540" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
    <rect x="0" y="140" width="320" height="20" rx="10" fill="#2196f3"/>
    <text x="550" y="155" font-size="12" fill="#ffffff">59%</text>
  </g>
</svg>
